name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  build-release:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            nix-package: pagers-x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            nix-package: pagers-aarch64-unknown-linux-musl
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            nix-package: pagers-aarch64-unknown-linux-gnu
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            nix-package: pagers-armv7-unknown-linux-gnueabihf
          - target: aarch64-apple-darwin
            os: macos-latest
            nix-package: pagers
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/flakehub-cache-action@v3
        timeout-minutes: 10
        continue-on-error: true

      - name: Build
        run: nix build .#${{ matrix.nix-package }}

      - name: Create archive
        id: archive
        run: |
          version="${RELEASE_TAG#v}"
          name="pagers-v${version}-${{ matrix.target }}"
          mkdir -p "${name}"
          cp result/bin/pagers "${name}/"

          if [ -d result/share/man ]; then
            mkdir -p "${name}/man"
            cp result/share/man/man1/* "${name}/man/"
          fi

          if [ -d result/share/bash-completion ]; then
            mkdir -p "${name}/completions"
            cp result/share/bash-completion/completions/* "${name}/completions/"
          fi
          if [ -d result/share/zsh ]; then
            cp result/share/zsh/site-functions/* "${name}/completions/"
          fi
          if [ -d result/share/fish ]; then
            cp result/share/fish/vendor_completions.d/* "${name}/completions/"
          fi

          tar czf "${name}.tar.gz" "${name}"
          echo "ASSET=${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.archive.outputs.ASSET }}

  upload-assets:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" artifacts/**/*.tar.gz --clobber --repo "$GITHUB_REPOSITORY"

  flakehub-publish:
    name: Publish to FlakeHub
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/flakehub-cache-action@v3
      - uses: DeterminateSystems/flakehub-push@main
        with:
          visibility: public
          name: LilDojd/pagers
          include-output-paths: true
